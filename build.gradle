plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
	archivesName = "oemer-client"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"oemerclient" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
	// Modrinth: Distant Horizons (Original-Mod, LGPL-3.0) wird mit eingebaut
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Distant Horizons steckt in der fertigen .jar (Jar-in-Jar) und läuft auch im Test mit
	include "maven.modrinth:distanthorizons:${project.distant_horizons_version}"
	modLocalRuntime "maven.modrinth:distanthorizons:${project.distant_horizons_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// ---------------------------------------------------------------------
// Automatischer Test: startet Minecraft in GitHub und prüft die Mod.
// (Der Testcode landet NICHT in der fertigen .jar.)
// ---------------------------------------------------------------------
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "oemerclient-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true // Minecraft-EULA für den Testlauf
	}
}

tasks.matching { it.name == "runClientGameTest" }.configureEach {
	jvmArgs("-Dfabric.client.gametest.disableNetworkSynchronizer=true")
}
