plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "oemer-client-mc26.3"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"oemerclient" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
	// Modrinth: Distant Horizons (Original-Mod, LGPL-3.0) wird mit eingebaut
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JCodec (reines Java): macht aus den Clipper-Bildern ein MP4 – steckt in der fertigen .jar
	implementation "org.jcodec:jcodec:0.2.5"
	implementation "org.jcodec:jcodec-javase:0.2.5"
	include "org.jcodec:jcodec:0.2.5"
	include "org.jcodec:jcodec-javase:0.2.5"

	// Distant Horizons (26.3): kommt wieder dazu, sobald die passende Version feststeht
	// include "maven.modrinth:distanthorizons:${project.distant_horizons_version}"
	// localRuntime "maven.modrinth:distanthorizons:${project.distant_horizons_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs += ["-Xmaxerrs", "2000"]
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// ---------------------------------------------------------------------
// Automatischer Test: startet Minecraft in GitHub und prüft die Mod.
// (Der Testcode landet NICHT in der fertigen .jar.)
// ---------------------------------------------------------------------
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "oemerclient-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true // Minecraft-EULA für den Testlauf
	}
}

tasks.matching { it.name == "runClientGameTest" }.configureEach {
	jvmArgs("-Dfabric.client.gametest.disableNetworkSynchronizer=true")
	// größeres Fenster, damit die Screenshots so aussehen wie auf einem echten Bildschirm
	args("--width", "1280", "--height", "720")
	// Freunde-Test läuft gegen den Firebase-Emulator (wird in der CI gestartet)
	if (System.getenv("OEMER_FIREBASE_EMU")) {
		jvmArgs("-Doemer.firebase.emulator=" + System.getenv("OEMER_FIREBASE_EMU"))
	}
}
