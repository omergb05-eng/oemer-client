# Schneller Test nur für die Firebase-Regeln (ohne Minecraft).
name: firebase-rules
on:
  push:
    branches-ignore: [ci-results, ci-rules]
    paths: [ 'firebase/**', 'firebase.json', 'ci/rules-test.mjs', '.github/workflows/rules.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: firebase emulator + regeltest
        run: |
          mkdir -p ci-out
          npm install -g firebase-tools
          firebase emulators:exec --only auth,database --project demo-oemer "node ci/rules-test.mjs" 2>&1 | tee ci-out/rules.log
      - name: publish
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          OUT=$(mktemp -d)
          cp ci-out/rules.log "$OUT/rules.log"
          cd "$OUT"
          git init -q -b ci-rules
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Rules-Test $GITHUB_SHA"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-rules
