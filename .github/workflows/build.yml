# Baut die Mod bei jedem Push, testet sie in einem echten Minecraft
# und legt Logs + Screenshots in den Branch "ci-results".

name: build
on:
  push:
    branches-ignore: [ci-results, ci-rules]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        id: build
        run: |
          mkdir -p ci-out
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee ci-out/build.log
      - name: capture build artifacts
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: OemerClient-jar
          path: build/libs/

      - name: read minecraft signatures
        if: always()
        continue-on-error: true
        run: bash ci/javap.sh

      - name: install xvfb
        if: steps.build.outcome == 'success'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: start firebase emulator (für den Freunde-Test)
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          npm install -g firebase-tools
          nohup firebase emulators:start --only auth,database --project demo-oemer > ci-out/emulator.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s http://127.0.0.1:9099 >/dev/null && curl -s http://127.0.0.1:9000 >/dev/null; then echo "emulator bereit"; break; fi
            sleep 2
          done
      - name: client game test
        id: gametest
        if: steps.build.outcome == 'success'
        timeout-minutes: 25
        env:
          OEMER_FIREBASE_EMU: 127.0.0.1
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest --stacktrace 2>&1 | tee ci-out/test.log

      - name: publish results to branch ci-results
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          OUT=$(mktemp -d)
          cp -r ci-out/. "$OUT/" 2>/dev/null
          mkdir -p "$OUT/screenshots" "$OUT/run-logs"
          find build/run -path '*screenshots*' -name '*.png' -exec cp {} "$OUT/screenshots/" \; 2>/dev/null
          find build/run -path '*logs*' \( -name 'latest.log' -o -name 'debug.log' \) -exec cp {} "$OUT/run-logs/" \; 2>/dev/null
          find build/run -path '*crash-reports*' -name '*.txt' -exec cp {} "$OUT/run-logs/" \; 2>/dev/null
          find build/run -name 'DistantHorizons.toml' -exec cp {} "$OUT/run-logs/" \; 2>/dev/null
          grep -h "OEMER-TEST" "$OUT/test.log" > "$OUT/test-summary.txt" 2>/dev/null
          printf 'commit: %s\nrun: %s\nbuild: %s\ngametest: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            "${{ steps.build.outcome }}" "${{ steps.gametest.outcome }}" > "$OUT/status.txt"
          cd "$OUT"
          git init -q -b ci-results
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "CI results for $GITHUB_SHA (run $GITHUB_RUN_ID)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results
